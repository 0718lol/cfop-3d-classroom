<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f1" />
    <title>CFOP 立体教室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <div><strong>CFOP 立体教室</strong><span>119 个案例 · 逐步三维演示</span></div>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="resetView" type="button" aria-label="复位视角" data-tooltip="复位视角">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button class="quiet-button" id="resetLesson" type="button">重置案例</button>
        </div>
      </header>

      <section class="workspace">
        <aside class="lesson-panel" aria-label="CFOP 课程阶段">
          <div class="panel-heading">
            <span class="eyebrow">学习路径</span>
            <strong>CFOP 四阶段</strong>
          </div>
          <nav id="stageList" class="stage-list"></nav>
          <div class="notation-key">
            <span class="eyebrow">公式图例</span>
            <div><code>R</code><span>顺时针 90°</span></div>
            <div><code>R'</code><span>逆时针 90°</span></div>
            <div><code>R2</code><span>旋转 180°</span></div>
            <div><code>r</code><span>右侧双层转动</span></div>
            <div><code>M</code><span>中间层转动</span></div>
          </div>
        </aside>

        <section class="cube-stage" aria-label="三维魔方演示">
          <div id="scene" class="scene"></div>
          <div class="scene-overlay">
            <span id="viewLabel">拖动旋转视角 · 滚轮缩放</span>
            <div class="axis-cue" aria-label="方向：上、前、右">
              <span class="axis up">U</span><span class="axis front">F</span><span class="axis right">R</span>
            </div>
          </div>
          <div id="turnBadge" class="turn-badge" aria-live="polite"><span>当前转动</span><strong>准备</strong></div>
        </section>

        <aside class="coach-panel">
          <div class="lesson-copy">
            <span class="stage-number" id="stageNumber">01</span>
            <span class="eyebrow" id="stageEnglish">CROSS</span>
            <h1 id="lessonTitle">底层十字</h1>
            <p id="lessonGoal"></p>
          </div>
          <label class="case-picker" for="caseSelect">
            <span>选择案例</span>
            <select id="caseSelect"></select>
          </label>
          <div class="focus-note">
            <span class="focus-dot"></span>
            <div><span>观察重点</span><strong id="focusText"></strong></div>
          </div>
          <div class="algorithm-block">
            <div class="algorithm-heading"><span>演示公式</span><span id="stepCount">0 / 0</span></div>
            <div id="algorithm" class="algorithm" aria-label="公式步骤"></div>
          </div>
          <div class="transport">
            <button class="icon-button transport-button" id="previous" type="button" aria-label="上一步">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button class="play-button" id="play" type="button">
              <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg>
              <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
              <span>播放演示</span>
            </button>
            <button class="icon-button transport-button" id="next" type="button" aria-label="下一步">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
          <label class="speed-control" for="speed">
            <span>转动速度</span><strong id="speedValue">1.0×</strong>
            <input id="speed" type="range" min="0.5" max="2" step="0.5" value="1" />
          </label>
          <div class="keyboard-note"><kbd>←</kbd><kbd>→</kbd><span>逐步学习</span><kbd>空格</kbd><span>播放 / 暂停</span></div>
        </aside>
      </section>
    </main>
    <script type="importmap">
      {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"}}
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
